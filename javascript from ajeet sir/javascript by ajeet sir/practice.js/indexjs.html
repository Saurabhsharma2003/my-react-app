<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>order list \ and un orderlist</title>
</head>
<body>
    <!-- if you want to change the type of order list  then use type -->
    <!-- this is order list -->
    <ol type="I">
        <!-- li means list item -->
         <!-- you can add sublist in it -->
        <li>apple </li>
        <ol>
            <li>kashmir</li>
        </ol>
        <li>banana</li>
        <ol>
            <li>up</li>
        </ol>
        <li>awacardo</li>
        <ol>
            <li>himachal</li>
        </ol>
        <li>grapes</li>
        <ol>
            <li>uttarpradesh</li>
        </ol>
    </ol>
    <!--this is  unorderlist  -->
    <!-- to change the type of unorderlist use style="list-style-type: square;" -->
    <ul style="list-style-type: square;">
        <!-- li means list items -->
        <li>ironman</li>
        <ul>
            <li>tony stark</li>
        </ul>
        <li>hulk</li>
        <ul>
            <li>banner</li>
        </ul>
        <li>loki</li>
        <ul>
            <li>ragnork</li>
        </ul>
        <li>thor</li>
        <!-- you can add sublist on it means another list in one list -->

    </ul>
</body>
</html>
