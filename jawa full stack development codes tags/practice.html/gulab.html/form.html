<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Switching Assignment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            color: #333333;
            margin-bottom: 8px;
            text-align: center;
        }

        .screen-indicator {
            font-size: 14px;
            color: #666666;
            margin-bottom: 25px;
            background: #ffffff;
            padding: 6px 15px;
            border-radius: 20px;
            border: 1px solid #dddddd;
        }

        .image-container {
            width: 100%;
            max-width: 800px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            background-color: #ffffff;
            display: flex;
        }

        .responsive-img {
            width: 100%;
            height: auto;
            display: block;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <h2>Responsive Image Assignment</h2>
    <div class="screen-indicator">Resize browser window to test the 700px breakpoint</div>

    <div class="image-container">
 
        <picture>
            <source media="(min-width: 700px)" srcset="https://picsum.photos">
            
            
            <img class="responsive-img" src="https://picsum.photos" alt="Assignment Responsive View">
        </picture>
    </div>

</body>
</html>
